[tox]
envlist =
    py{311,312,313,314}-dj52
    pypy311-dj52
    py{312,313,314}-dj60
    py{312,313,314,315}-dj61
    py{314}-djmain
    py{311}-djqa

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
    pypy-3.11: pypy311

[gh-actions:env]
DJANGO =
    5.2: dj52
    6.0: dj60
    6.1: dj61
    main: djmain
    qa: djqa

[testenv]
deps =
    dj52: django>=5.2.8,<5.3
    dj60: django>=6.0,<6.1
    dj61: django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz
    coverage
    requests-mock
usedevelop = True
commands =
    coverage run -m django test --settings=embed_video.tests.django_settings
    coverage report
setenv =
    PYTHONDONTWRITEBYTECODE=1
# Django development version is allowed to fail the test matrix
ignore_outcome =
    djmain: True
ignore_errors =
    djmain: True

[testenv:py311-djqa]
ignore_errors = true
basepython = 3.11
deps =
    black~=26.1
    isort~=7.0
skip_install = true
commands =
    isort --profile black --check-only --diff embed_video
    black --check --diff embed_video
    isort --profile black --check-only --diff --extend-skip-glob='**/migrations' example_project
    black --check --diff --extend-exclude '/migrations' example_project
