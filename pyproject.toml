[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-embed-video"
dynamic = ["version", "readme"]
description = "Django app for easy embedding YouTube and Vimeo videos and music from SoundCloud."
authors = [
    {name = "Cedric Carrard", email = "cedric.carrard@gmail.com"},
]
keywords = ["youtube", "vimeo", "video", "soundcloud"]
dependencies = [
    "requests>=2.19",
    "Django>=5.2",
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Environment :: Plugins",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://github.com/django-commons/django-embed-video"

[tool.setuptools.packages.find]
include = ["embed_video*"]

[tool.setuptools.dynamic]
# The changelog is shown after the README on PyPI
readme = {file = ["README.rst", "CHANGES.rst"], content-type = "text/x-rst"}

[tool.setuptools_scm]
